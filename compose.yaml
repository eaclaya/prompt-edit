# Local development and CI stack (see docs/PLAN.md §0).
# Every worktree sets its own COMPOSE_PROJECT_NAME and port offsets in .env,
# so several stacks can run side by side without colliding.

x-app: &app
    build:
        context: ./docker/8.4
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.4/app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER:-1000}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
        # Linux-native node_modules, kept apart from the host's copy.
        - 'node_modules:/var/www/html/node_modules'
    networks:
        - sail

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-80}:80'
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started

    queue:
        <<: *app
        command: ['php', 'artisan', 'queue:work', 'redis', '--tries=1']
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    vite:
        <<: *app
        command:
            [
                'sh',
                '-c',
                '[ -x node_modules/.bin/vp ] || npm ci; npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5173} --strictPort',
            ]
        restart: unless-stopped
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'

    pgsql:
        image: 'postgres:17'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE:-laravel}',
                    '-U',
                    '${DB_USERNAME:-sail}',
                ]
            interval: 2s
            retries: 30
            timeout: 5s

    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 2s
            retries: 30
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    # Public dev URL https://prompt-edit.hondukash.dev (ingress → http://app:80 is
    # configured in the Cloudflare dashboard). Only one stack runs this at a time.
    tunnel:
        image: 'cloudflare/cloudflared:latest'
        command:
            [
                'tunnel',
                '--no-autoupdate',
                'run',
                '--token',
                '${CLOUDFLARE_TUNNEL_TOKEN:-}',
            ]
        restart: unless-stopped
        depends_on:
            - app
        networks:
            - sail
        profiles:
            - tunnel

networks:
    sail:
        driver: bridge

volumes:
    pgsql:
        driver: local
    redis:
        driver: local
    node_modules:
        driver: local
