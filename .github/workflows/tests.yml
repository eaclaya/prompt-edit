name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_PROJECT_NAME: prompt-edit-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match container user to the runner
        run: |
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the app image
        run: docker compose build app

      - name: Start Postgres and Redis
        run: docker compose up -d --wait pgsql redis

      - name: Run make ci inside the stack (Pest, Pint, Larastan, type-check)
        run: docker compose run --rm --no-deps app make ci

      - name: Stop the stack
        if: always()
        run: docker compose down -v
